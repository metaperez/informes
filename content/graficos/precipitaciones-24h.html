<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precipitación acumulada en 24 horas</title>
<style>
:root{color-scheme:light;--ink:#173044;--muted:#5d7180;--bar:#167fa1;--bar-active:#075c7a;--line:#dce5ea}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 34px}h1{font-size:clamp(1.25rem,3.5vw,1.8rem);line-height:1.2;margin:0 0 7px}p{margin:0 0 18px;color:var(--muted);font-size:.92rem}
#chart{width:100%}svg{width:100%;height:auto;display:block;overflow:visible}.bar{fill:var(--bar);transition:fill .15s}.bar:hover,.bar:focus{fill:var(--bar-active);outline:none}.axis text{fill:var(--muted);font-size:12px}.axis path,.axis line{stroke:var(--line)}.name{font-size:13px;fill:var(--ink)}.value{font-size:12px;font-weight:650;fill:var(--ink)}.grid line{stroke:var(--line);stroke-dasharray:2 4}.grid path{display:none}
#tooltip{position:fixed;pointer-events:none;background:#173044;color:white;padding:9px 12px;border-radius:5px;font-size:13px;box-shadow:0 3px 12px #0002;opacity:0;z-index:2;max-width:240px}#tooltip strong{display:block;margin-bottom:3px}#tooltip.visible{opacity:1}.fallback{padding:16px;background:#f2f6f8}
@media(max-width:500px){main{padding:16px 10px}.name{font-size:11px}.value{font-size:11px}.axis text{font-size:11px}}
</style>
</head>
<body>
<main>
<h1>Precipitación acumulada en 24 horas</h1>
<p>Diez localidades · Valores en litros por metro cuadrado (l/m²) · Orden alfabético</p>
<div id="chart" role="img" aria-label="Gráfico de barras horizontal con las precipitaciones acumuladas en 24 horas para diez localidades. Máximo: Pego, 638,5 litros por metro cuadrado. Mínimo: Alfauir, 435,4 litros por metro cuadrado."></div>
<div id="tooltip" aria-hidden="true"></div>
<noscript><p class="fallback">Activa JavaScript para visualizar el gráfico.</p></noscript>
</main>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const data = [
 {localidad:"Alfauir", valor:435.4},
 {localidad:"Barx", valor:505.6},
 {localidad:"El Real de Gandia", valor:518.8},
 {localidad:"Forna — l’Atzúbia", valor:635.2},
 {localidad:"Gandia", valor:487.3},
 {localidad:"La Vall d’Ebo", valor:537.2},
 {localidad:"Oliva", valor:457.4},
 {localidad:"Palma de Gandia", valor:456.8},
 {localidad:"Pego", valor:638.5},
 {localidad:"Vilallonga / Villalonga", valor:559.3}
];
const format = new Intl.NumberFormat('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1});
const root=d3.select('#chart'), tip=d3.select('#tooltip');
function render(){
 if(typeof d3==='undefined'){root.html('<p class="fallback">No se pudo cargar D3.js. Comprueba tu conexión.</p>');return;}
 const w=Math.max(280,root.node().clientWidth), mobile=w<550;
 const margin={top:12,right:mobile?54:78,bottom:42,left:mobile?153:205};
 const rowH=mobile?39:43, h=margin.top+data.length*rowH+margin.bottom;
 root.selectAll('*').remove();
 const svg=root.append('svg').attr('viewBox',`0 0 ${w} ${h}`).attr('aria-hidden','true');
 const plotW=w-margin.left-margin.right;
 const x=d3.scaleLinear().domain([0,700]).range([0,plotW]);
 const y=d3.scaleBand().domain(data.map(d=>d.localidad)).range([0,data.length*rowH]).padding(.27);
 const g=svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);
 const ticks=mobile?[0,200,400,600]:[0,100,200,300,400,500,600,700];
 g.append('g').attr('class','grid').call(d3.axisBottom(x).tickValues(ticks).tickSize(data.length*rowH).tickFormat(''));
 g.select('.grid').attr('transform','translate(0,0)');
 g.append('g').attr('class','axis').attr('transform',`translate(0,${data.length*rowH})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d=>d));
 g.append('text').attr('x',plotW/2).attr('y',data.length*rowH+36).attr('text-anchor','middle').attr('fill','#5d7180').attr('font-size',12).text('l/m²');
 g.selectAll('.name').data(data).join('text').attr('class','name').attr('x',-9).attr('y',d=>y(d.localidad)+y.bandwidth()/2).attr('dominant-baseline','middle').attr('text-anchor','end').text(d=>d.localidad);
 const bars=g.selectAll('.bar').data(data).join('rect').attr('class','bar').attr('x',0).attr('y',d=>y(d.localidad)).attr('width',d=>x(d.valor)).attr('height',y.bandwidth()).attr('rx',2).attr('tabindex',0).attr('role','img').attr('aria-label',d=>`${d.localidad}: ${format.format(d.valor)} litros por metro cuadrado`);
 g.selectAll('.value').data(data).join('text').attr('class','value').attr('x',d=>x(d.valor)+6).attr('y',d=>y(d.localidad)+y.bandwidth()/2).attr('dominant-baseline','middle').text(d=>format.format(d.valor));
 function show(event,d){tip.html(`<strong>${d.localidad}</strong>${format.format(d.valor)} l/m²`).classed('visible',true);move(event)}
 function move(event){if(!event||event.clientX===undefined)return;const left=Math.min(event.clientX+12,innerWidth-245),top=Math.max(8,event.clientY-58);tip.style('left',`${Math.max(8,left)}px`).style('top',`${top}px`)}
 function hide(){tip.classed('visible',false)}
 bars.on('pointerenter',show).on('pointermove',move).on('pointerleave',hide).on('focus',function(event,d){tip.html(`<strong>${d.localidad}</strong>${format.format(d.valor)} l/m²`).classed('visible',true).style('left','16px').style('top','16px')}).on('blur',hide).on('click',function(event,d){show(event,d)});
}
if(typeof d3!=='undefined'){render();new ResizeObserver(render).observe(document.querySelector('#chart'));}else{document.querySelector('#chart').innerHTML='<p class="fallback">No se pudo cargar D3.js. Comprueba tu conexión.</p>'}
</script>
</body>
</html>
